services:
  postgres:
    image: postgres:16-alpine
    container_name: typingtyphon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-typhon_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-typhon_password_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-typingtyphon_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - typingtyphon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typhon_user -d typingtyphon_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  typingtyphon_postgres_data:
    driver: local
